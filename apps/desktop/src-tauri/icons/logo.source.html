<style>
  html,body{margin:0;padding:0;background:transparent}
  svg{display:block}
</style>
<!-- Source of the icon set. Regenerate with:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
         --screenshot=icon-source.png --window-size=1024,1024 \
         --default-background-color=00000000 --hide-scrollbars logo.source.html
       pnpm tauri icon icon-source.png && rm -rf icons/android icons/ios
     1024 canvas, 824 body: the macOS convention, so the mark is not clipped by
     the Dock's own padding.

     Two shells: a dark squircle tile, and inside it the LedgerFlow card at the
     brand's blue-to-green. On the card, three ascending bars and two ledger
     lines (the ledger) over a wave and two arrows (the flow).

     Colours are the brand gradient, not App.css: the tile has to read against
     both a light and a dark Dock, which --accent alone does not. #0e7a57 is
     still the green the arrows resolve toward. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#13315f"/>
      <stop offset="0.55" stop-color="#104a5c"/>
      <stop offset="1" stop-color="#0d5f4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#1466c6"/>
      <stop offset="1" stop-color="#25c07c"/>
    </linearGradient>
    <!-- Top-edge sheen. Without it the tile reads flat next to the stock
         macOS icons it sits beside in the Dock. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- The card. Everything below is clipped to it, so a curve may run off its
       edge without escaping into the tile. -->
  <defs>
    <clipPath id="cardClip">
      <rect x="207" y="306" width="610" height="412" rx="64" ry="64"/>
    </clipPath>
  </defs>
  <rect x="207" y="306" width="610" height="412" rx="64" ry="64" fill="url(#card)"/>

  <g clip-path="url(#cardClip)">
    <!-- The card reads as three horizontal bands, and they must not touch:
         ledger lines 356-446, bars and the wave 384-580, arrows 520-680. An
         arrowhead that reaches a ledger line merges with it into one blob at
         64px — the first draft of this file did exactly that. -->

    <!-- Wave: a darker band filling the lower card, its top edge the flow line.
         Translucent navy rather than a flat fill, so the card gradient still
         reads through it. -->
    <path d="M207 606C330 654 452 626 560 578 660 534 742 540 817 500V718H207Z"
          fill="#0a2f5e" fill-opacity="0.38"/>

    <!-- Ledger: three ascending bars on a shared baseline, then two lines. -->
    <g fill="#ffffff" fill-opacity="0.94">
      <rect x="262" y="486" width="46" height="74" rx="10"/>
      <rect x="324" y="438" width="46" height="122" rx="10"/>
      <rect x="386" y="384" width="46" height="176" rx="10"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="474" y="356" width="286" height="36" rx="18"/>
      <rect x="474" y="410" width="188" height="36" rx="18"/>
    </g>

    <!-- Flow: two arrows over the wave. Heads point straight right so they stay
         legible at 32px, where a rotated head turns to mush. -->
    <g fill="#ffffff" fill-opacity="0.96">
      <path d="M462 566C548 566 606 542 664 516" fill="none" stroke="#ffffff"
            stroke-opacity="0.96" stroke-width="34" stroke-linecap="round"/>
      <path d="M676 470 786 518 676 566Z"/>
      <path d="M462 648C556 648 620 636 682 616" fill="none" stroke="#ffffff"
            stroke-opacity="0.96" stroke-width="34" stroke-linecap="round"/>
      <path d="M694 570 804 618 694 666Z"/>
    </g>
  </g>
</svg>
