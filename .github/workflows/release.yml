# Push a tag, get a signed release the installed app can update itself from.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# tauri-action builds, signs the updater payload, creates the GitHub release and
# uploads the updater JSON alongside the bundles. Doing it here rather than on a
# laptop also removes the stale-payload trap: a fresh checkout cannot reuse an
# artifact from a previous version's build.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    # macos-latest is Apple Silicon. Add a matrix entry with
    # --target x86_64-apple-darwin if an Intel build is ever needed.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The tag is what users see; tauri.conf.json is what the updater compares.
      # If they disagree, the release is labelled one version and reports
      # another, and no installed app will ever accept it.
      - name: Tag must match the version in tauri.conf.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match version $version"
            exit 1
          fi

      - run: pnpm --filter desktop test
      - run: pnpm typecheck

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of the updater keypair. Its public half is compiled
          # into every shipped binary, so this secret is the only thing that can
          # produce an update those binaries will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Expenses ${{ github.ref_name }}
          # Must not be a draft or a prerelease: the updater endpoint resolves
          # /releases/latest/, which skips both.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin
