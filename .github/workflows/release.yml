# Cut a release entirely from the browser: Actions -> release -> Run workflow,
# pick patch / minor / major. The workflow bumps the version in every file that
# carries it, commits and tags that bump, then builds, signs and publishes the
# release the installed app updates itself from. Nothing happens on a laptop, so
# a fresh checkout also removes the stale-payload trap in docs/auto-update.md
# rule 5 — CI cannot reuse an artifact from a previous version.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the bump commit and its tag, create the release

jobs:
  # Owns the version bump, the tag and the release itself; the Linux job only
  # adds artifacts to what this one created.
  release:
    # macos-latest is Apple Silicon. Add a matrix entry with
    # --target x86_64-apple-darwin if an Intel build is ever needed.
    runs-on: macos-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      # The default token is persisted as a git credential helper, which is what
      # later lets the bump commit push back to the branch this was dispatched
      # from. Since checkout v6 it lives in a file under $RUNNER_TEMP rather than
      # in .git/config; git push still picks it up with no extra configuration.
      - uses: actions/checkout@v7

      # v6 is the first release that accepts the pnpm 11 pinned in
      # packageManager, which is also where the version comes from.
      - uses: pnpm/action-setup@v6
      # Must stay after action-setup: the pnpm cache path is resolved by running
      # pnpm, so caching silently does nothing if pnpm is not on PATH yet.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Explicit, because since v6 only npm is cached automatically.
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Before the bump, so a red test never leaves a version commit pushed.
      - run: pnpm --filter desktop test
      - run: pnpm typecheck

      # tauri.conf.json is the source of truth — the bundler reads it and the
      # updater compares it. The other three only have to agree with it.
      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re

          conf = pathlib.Path("apps/desktop/src-tauri/tauri.conf.json")
          major, minor, patch = (int(p) for p in json.loads(conf.read_text())["version"].split("."))
          new = {
              "major": f"{major + 1}.0.0",
              "minor": f"{major}.{minor + 1}.0",
              "patch": f"{major}.{minor}.{patch + 1}",
          }[os.environ["BUMP"]]

          # Rewrite one line per file rather than round-tripping the JSON, so a
          # release commit never reformats a file it did not mean to touch.
          for path, pattern in [
              (conf, r'("version":\s*")[^"]+'),
              (pathlib.Path("apps/desktop/package.json"), r'("version":\s*")[^"]+'),
              (pathlib.Path("apps/desktop/src-tauri/Cargo.toml"), r'(?m)^(version = ")[^"]+'),
              # Cargo.lock carries the crate's own version too; leaving it stale
              # is what makes a later --locked build fail.
              (pathlib.Path("apps/desktop/src-tauri/Cargo.lock"), r'(name = "desktop"\nversion = ")[^"]+'),
          ]:
              text = path.read_text()
              text, n = re.subn(pattern, lambda m: m.group(1) + new, text, count=1)
              assert n == 1, f"no version to replace in {path}"
              path.write_text(text)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={new}\n")
          PY

      - name: Commit and tag the bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$VERSION"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of the updater keypair. Its public half is compiled
          # into every shipped binary, so this secret is the only thing that can
          # produce an update those binaries will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ steps.bump.outputs.version }}
          releaseName: LedgerFlow v${{ steps.bump.outputs.version }}
          # Must not be a draft or a prerelease: the updater endpoint resolves
          # /releases/latest/, which skips both.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin

  # Sequential, not a matrix entry, because every job writes latest.json to the
  # same release: running one at a time means tauri-action merges this platform's
  # key into the manifest the previous job uploaded, instead of racing it.
  linux:
    needs: release
    # Pinned to the oldest supported image on purpose: an AppImage links the
    # glibc it was built against, so building on 24.04 would refuse to start on
    # anything older.
    runs-on: ubuntu-22.04

    steps:
      # The tag, not the branch — the branch may have moved since, and this must
      # build the exact tree the macOS artifacts came from.
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      # webkit2gtk-4.1 is the Tauri v2 webview (v1 used 4.0); patchelf is what
      # the AppImage bundler uses to rewrite the interpreter paths.
      - name: Install the webview and bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The checks already passed on the macOS job for this exact commit.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Same tag as the macOS job, so this uploads into that release rather
          # than creating a second one.
          tagName: v${{ needs.release.outputs.version }}
          releaseName: LedgerFlow v${{ needs.release.outputs.version }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # rpm is dropped: it cannot self-update either, and deb already covers
          # the "install it properly" case.
          args: --bundles deb,appimage

  # Third link in the same chain, and for the same reason: latest.json is one
  # file on one release, so this job must not overlap with the two before it.
  windows:
    needs: [release, linux]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      # Nothing to install: WebView2 is preinstalled on the runner image and on
      # every supported Windows, and the Tauri CLI fetches NSIS itself.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The checks already passed on the macOS job for this exact commit.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ needs.release.outputs.version }}
          releaseName: LedgerFlow v${{ needs.release.outputs.version }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # nsis only. It produces the `-setup.exe`, which is both the download
          # and the update payload; msi would add a second installer doing the
          # same job and a second updater artifact for the same platform key.
          args: --bundles nsis
